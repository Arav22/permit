[project]
name = "permit"
version = "3.0.0"
description = "Plain-English permission explainer with cost estimation, smart rollback, and Claude Code coach"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arav" }]
keywords = ["claude-code", "permissions", "explainer", "ai-safety", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Arav22/permit"
Issues = "https://github.com/Arav22/permit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["core", "hooks"]
